name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The browser tests grew with every feature: on 2026-11-16 this job took 19 to 24 minutes on GitHub (run 164: 24 minutes
    # 4 seconds, 56 seconds below the old limit of 25; audit finding A1-09). A run that stops at the limit is a red run, and
    # no milestone closes on a red run (hard rule 3). The limit leaves room to grow; a run that hangs still ends.
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit hash so that a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (exact versions, no install scripts)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Boundaries
        run: npm run boundaries
      - name: Unit tests
        run: npm test
      - name: Licence notices are current
        run: node scripts/make-notices.mjs --check
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the page, checks its size, drives it in a browser)
        run: npm run e2e
      - name: Dependency audit
        run: npm audit --audit-level=high

  # Two programs that the builder did not write read two files of the Vision (SPEC.md section 2.9, decision D64).
  # They run here only: the owner decided on 2026-11-16 that they are never run on the machine where the Studio is built.
  # Their packages live in a folder of their own, with their own pinned versions, and never ship in the Studio.
  outside-validators:
    name: Outside validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install the Studio's packages (exact versions, no install scripts)
        run: npm ci --ignore-scripts
      - name: Install the two outside validators (exact versions, no install scripts)
        run: npm ci --ignore-scripts
        working-directory: validators
      - name: DESIGN.md and tokens.json, read by programs that the builder did not write
        run: npx vitest run --config validators/vitest.config.mjs

