name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit hash so that a moved tag cannot change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install (exact versions, no install scripts)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Boundaries
        run: npm run boundaries
      - name: Unit tests
        run: npm test
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the page, checks its size, drives it in a browser)
        run: npm run e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
